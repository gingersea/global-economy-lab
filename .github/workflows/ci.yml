name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: pytest (no API keys)
    runs-on: ubuntu-latest
    # Explicitly do NOT pass FRED_API_KEY to ensure the project keeps running
    # entirely on free, key-less data sources.
    env:
      FRED_API_KEY: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyarrow

      - name: Run unit tests
        run: pytest tests/ -v --tb=short

      - name: Smoke-test no-key data sources (mocked HTTP)
        run: pytest tests/test_backends.py -v --tb=short
