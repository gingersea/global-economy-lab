[tool.poetry]
name = "global-economy-lab"
version = "0.1.0"
description = "A Python data framework for learning and understanding the global economy"
authors = ["Your Name <you@example.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.10"
pandas = "^2.0"
numpy = "^1.25"
matplotlib = "^3.7"
plotly = "^5.18"
yfinance = "^0.2"
fredapi = "^0.5"
akshare = ">=1.10"
requests = "^2.31"
pydantic = "^2.0"
pydantic-settings = "^2.0"
loguru = "^0.7"
jupyter = "^1.0"
notebook = "^7.0"
python-dotenv = "^1.0"
tenacity = "^8.2"

[tool.poetry.group.optional.dependencies]
streamlit = "^1.28"
fastapi = ">=0.109.1"
uvicorn = { extras = ["standard"], version = "^0.24" }

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-cov = "^4.1"
black = ">=26.3.1"
ruff = "^0.1"
mypy = "^1.6"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
